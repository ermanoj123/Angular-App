<div class="auth-wrapper">
    <div class="container">
        <div class="card change-password-card">
            <h2 class="text-center">Change Password</h2>

            <div class="alert alert-error" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>

            <div class="alert alert-success" *ngIf="successMessage">
                {{ successMessage }}
            </div>

            <form (ngSubmit)="onSubmit()" #changePasswordForm="ngForm">
                <div class="form-group">
                    <label for="currentPassword">Current Password</label>
                    <input type="password" id="currentPassword" name="currentPassword"
                        [(ngModel)]="passwordData.currentPassword" required placeholder="Enter current password" />
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" [(ngModel)]="passwordData.newPassword"
                        required minlength="6" placeholder="Enter new password" />
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        [(ngModel)]="passwordData.confirmPassword" required placeholder="Confirm new password" />
                </div>

                <div class="actions">
                    <button type="submit" [disabled]="isLoading || !changePasswordForm.valid">
                        {{ isLoading ? 'Updating...' : 'Change Password' }}
                    </button>
                    <button type="button" class="btn-cancel" routerLink="/dashboard">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
