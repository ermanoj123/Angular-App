<div class="auth-wrapper auth-wrapper-full">
  <div class="container">
    <div class="card">
      <h2 class="text-center">Create Account</h2>

      <div class="alert alert-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="alert alert-success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" name="username" [(ngModel)]="registerData.username" required
            [class.error]="registerForm.submitted && !registerData.username" placeholder="Choose a username" />
          <div class="error-message" *ngIf="registerForm.submitted && !registerData.username">
            Username is required
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" [(ngModel)]="registerData.email" required email
            [class.error]="registerForm.submitted && !registerData.email" placeholder="Enter your email" />
          <div class="error-message" *ngIf="registerForm.submitted && !registerData.email">
            Valid email is required
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" name="password" [(ngModel)]="registerData.password" required
            minlength="6" [class.error]="registerForm.submitted && !registerData.password"
            placeholder="Choose a password (min 6 characters)" />
          <div class="error-message" *ngIf="registerForm.submitted && !registerData.password">
            Password is required (minimum 6 characters)
          </div>
        </div>

        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" [(ngModel)]="registerData.firstName"
            placeholder="Enter your first name (optional)" />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" [(ngModel)]="registerData.lastName"
            placeholder="Enter your last name (optional)" />
        </div>

        <div class="form-group">
          <label for="profileImage">Profile Image</label>
          <div class="image-upload-container">
            <input type="file" id="profileImage" name="profileImage" accept="image/*" (change)="onFileSelected($event)"
              #fileInput style="display: none;" />

            <div *ngIf="!imagePreview" class="upload-placeholder" (click)="fileInput.click()">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <p>Click to upload profile image</p>
              <small>JPG, PNG or GIF (max 5MB)</small>
            </div>

            <div *ngIf="imagePreview" class="image-preview-container">
              <img [src]="imagePreview" alt="Profile preview" class="image-preview" />
              <button type="button" class="remove-image-btn" (click)="removeImage()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Creating Account...' : 'Register' }}
        </button>
      </form>

      <div class="text-center mt-3">
        <p>Already have an account? <a routerLink="/login" class="link">Login here</a></p>
      </div>
    </div>
  </div>
</div>
