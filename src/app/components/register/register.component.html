<div class="container">
  <div class="card">
    <h2 class="text-center">Create Account</h2>
    
    <div class="alert alert-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="alert alert-success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-group">
        <label for="username">Username *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="registerData.username"
          required
          [class.error]="registerForm.submitted && !registerData.username"
          placeholder="Choose a username"
        />
        <div class="error-message" *ngIf="registerForm.submitted && !registerData.username">
          Username is required
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="registerData.email"
          required
          email
          [class.error]="registerForm.submitted && !registerData.email"
          placeholder="Enter your email"
        />
        <div class="error-message" *ngIf="registerForm.submitted && !registerData.email">
          Valid email is required
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password *</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="registerData.password"
          required
          minlength="6"
          [class.error]="registerForm.submitted && !registerData.password"
          placeholder="Choose a password (min 6 characters)"
        />
        <div class="error-message" *ngIf="registerForm.submitted && !registerData.password">
          Password is required (minimum 6 characters)
        </div>
      </div>

      <div class="form-group">
        <label for="firstName">First Name</label>
        <input
          type="text"
          id="firstName"
          name="firstName"
          [(ngModel)]="registerData.firstName"
          placeholder="Enter your first name (optional)"
        />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input
          type="text"
          id="lastName"
          name="lastName"
          [(ngModel)]="registerData.lastName"
          placeholder="Enter your last name (optional)"
        />
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ isLoading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>

    <div class="text-center mt-3">
      <p>Already have an account? <a routerLink="/login" class="link">Login here</a></p>
    </div>
  </div>
</div>
