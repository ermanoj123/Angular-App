<nav class="navbar" *ngIf="isLoggedIn">
    <!-- Removed logo and context info as requested -->

    <div class="navbar-right">
        <div class="user-profile-container">
            <div class="user-profile">
                <span class="material-icons user-icon">person_outline</span>
                <div class="user-info">
                    <div class="welcome-container">
                        <span class="welcome-text">WELCOME</span>
                        <span class="colon">:</span>
                    </div>
                    <span class="username">{{ username | uppercase }}</span>
                    <span class="material-icons arrow-icon">expand_more</span>
                </div>
            </div>

            <div class="dropdown-menu">
                <a class="dropdown-item" routerLink="/change-password">
                    <span class="material-icons item-icon">logout</span>
                    <span>Change Password</span>
                </a>
                <div class="dropdown-item divider"></div>
                <div class="dropdown-item" (click)="logout()">
                    <span class="material-icons item-icon">logout</span>
                    <span>Log Out</span>
                </div>
            </div>
        </div>

        <button class="logout-btn-nav" (click)="logout()" title="Logout">
            <span class="material-icons">logout</span>
        </button>
    </div>
</nav>
