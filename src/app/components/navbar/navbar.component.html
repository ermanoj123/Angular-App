<nav class="navbar" *ngIf="isLoggedIn">
    <div class="navbar-left">
        <div class="logo">
            <span class="logo-neo">neo</span><span class="logo-erp">erp</span>
            <div class="logo-dot"></div>
        </div>
        <div class="context-info">
            <span class="project-name">Demo-Jc</span>
            <span class="separator">|</span>
            <span class="location">Itahari</span>
        </div>
    </div>

    <div class="navbar-right">
        <div class="action-icons">
            <button class="icon-btn" title="Search">
                <span class="material-icons">search</span>
            </button>
            <button class="icon-btn" title="Fullscreen">
                <span class="material-icons">fullscreen</span>
            </button>
        </div>

        <div class="user-profile">
            <span class="material-icons user-icon">person_outline</span>
            <div class="user-info">
                <span class="welcome-text">WELCOME :</span>
                <span class="username">{{ username | uppercase }}</span>
                <span class="material-icons arrow-icon">expand_more</span>
            </div>
        </div>

        <button class="logout-btn" (click)="logout()" title="Logout">
            <span class="material-icons">logout</span>
        </button>
    </div>
</nav>
